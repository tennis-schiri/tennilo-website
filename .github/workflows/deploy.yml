name: TENNILO Website manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'public/**'
      - 'tests/**'
      - 'scripts/**'
      - 'deploy-files.txt'

permissions:
  contents: read

concurrency:
  group: tennilo-website-deploy
  cancel-in-progress: false

jobs:
  discover:
    name: Workflow registrieren – kein Upload
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[deploy-live]')
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Workflow wurde registriert. Kein FTP-Upload ausgeführt.'

  deploy:
    name: Website und Founders-PHP per FTPS hochladen
    if: (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-live]'))) && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Freigestellte TENNILO-Logos erstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "Pillow>=10,<13"
          python3 scripts/prepare_transparent_logos.py
          python3 scripts/prepare_home_badges.py
          python3 scripts/build_mw_footer_logos.py
          python3 scripts/prepare_founders_badges.py
          python3 scripts/prepare_founders_certificates.py
          for variant in tf09-light tf09-dark tf12-light tf12-dark; do
            upper="${variant%%-*}"; mode="${variant#*-}"
            cp "brand-assets/founders/TENNILO-Founders-${upper^^}-$mode.png" "public/assets/tennilo-founders-$variant.png"
          done

      - name: Originale ClubDisplay-Demo-Screenshots aufnehmen
        run: |
          python3 -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python3 -m playwright install --with-deps chromium
          fi
          python3 scripts/capture_clubdisplay_screenshots.py
      - name: Datei-Freigabeliste prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-files.txt
          count=0
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ "$file" =~ ^public/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Ungültiger Dateipfad: $file"; exit 1; }
            [[ "$file" != *..* ]] || { echo "::error::Pfad mit '..' verboten"; exit 1; }
            test -f "$file" || { echo "::error::Datei fehlt: $file"; exit 1; }
            count=$((count+1))
          done < deploy-files.txt
          echo "Freigegebene Dateien: $count"
          grep -Fxq "public/founders.php" deploy-files.txt
          grep -Fxq "public/newsletter.php" deploy-files.txt
          grep -Fxq "public/admin/index.php" deploy-files.txt
          grep -Fxq "public/admin/analytics.php" deploy-files.txt
          grep -Fxq "public/visit.php" deploy-files.txt
          grep -Fxq "public/founders-admin.php" deploy-files.txt
          grep -Fxq "public/founders-mail.php" deploy-files.txt
          grep -Fxq "public/founders-email-template.php" deploy-files.txt
          grep -Fxq "public/founders-setup.php" deploy-files.txt
          grep -Fxq "public/founders-check.php" deploy-files.txt
          grep -Fxq "public/index.html" deploy-files.txt
          grep -Fxq "public/en/index.html" deploy-files.txt
          grep -Fxq "public/en/imprint.html" deploy-files.txt
          grep -Fxq "public/en/privacy.html" deploy-files.txt
          grep -Fxq "public/assets/score-creative.css" deploy-files.txt
          grep -Fxq "public/assets/court-edition.css" deploy-files.txt
          grep -Fxq "public/assets/professional-home.css" deploy-files.txt
          grep -Fxq "public/assets/home-overview.css" deploy-files.txt
          grep -Fxq "public/assets/product-pages.css" deploy-files.txt
          grep -Fxq "public/score/index.html" deploy-files.txt
          grep -Fxq "public/en/score/index.html" deploy-files.txt
          grep -Fxq "public/tournament/index.html" deploy-files.txt
          grep -Fxq "public/en/tournament/index.html" deploy-files.txt
          grep -Fxq "public/umpire/index.html" deploy-files.txt
          grep -Fxq "public/en/umpire/index.html" deploy-files.txt
          grep -Fxq "public/updates/index.html" deploy-files.txt
          grep -Fxq "public/en/updates/index.html" deploy-files.txt
          grep -Fxq "public/assets/score-demo.js" deploy-files.txt
          grep -Fxq "public/assets/score-gallery.css" deploy-files.txt
          grep -Fxq "public/assets/score-demo-watch.png" deploy-files.txt
          grep -Fxq "public/assets/score-demo-phone.png" deploy-files.txt
          grep -Fxq "public/assets/score-demo-scoreboard.png" deploy-files.txt
          grep -Fxq "public/assets/theme.js" deploy-files.txt
          grep -Fxq "public/assets/theme.css" deploy-files.txt
          grep -Fxq "public/assets/back-to-top.css" deploy-files.txt
          grep -Fxq "public/assets/transparent-logos.css" deploy-files.txt
          grep -Fxq "public/assets/footer-credit.css" deploy-files.txt
          grep -Fxq "public/assets/mw-symbol-light.png" deploy-files.txt
          grep -Fxq "public/assets/mw-symbol-dark.png" deploy-files.txt
          grep -Fxq "public/assets/tennilo-tournament-cutout.png" deploy-files.txt
          grep -Fxq "public/assets/tennilo-score-cutout.png" deploy-files.txt
          grep -Fxq "public/assets/tennilo-score-cutout-dark.png" deploy-files.txt
          grep -Fxq "public/assets/tennilo-umpire-cutout.png" deploy-files.txt
          grep -Fxq "public/assets/tennilo-logo-dark.png" deploy-files.txt

      - name: Score-Startseite und Navigation prüfen
        run: |
          node --check public/assets/site-interactions.js
          node --check public/assets/score-demo.js
          node --check public/assets/theme.js
          node --test tests/score-landing-test.mjs tests/tennilo-language-test.mjs tests/tennilo-creative-test.mjs tests/tennilo-theme-test.mjs tests/founders-campaign-test.mjs

      - name: PHP-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -l public/founders.php
          php -l public/newsletter.php
          php -l public/admin/index.php
          php -l public/admin/founders.php
          php -l public/admin/founders-fulfilment-lib.php
          php -l public/founders/supporters.php
          php tests/founders-fulfilment-test.php
          php -l public/admin/analytics.php
          php tests/tennilo-analytics-test.php
          php -l public/visit.php
          php -l public/founders-admin.php
          php -l public/founders-mail.php
          php -l public/founders-email-template.php
          php -l public/founders-setup.php
          php -l public/founders-check.php

      - name: Live-Prüfskript vor dem Upload auf Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify_live_deploy.py

      - name: Ausschließlich freigegebene Website-Dateien per FTPS übertragen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USER fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          # FTP-Benutzer muss sein Startverzeichnis in /tennilo-website/ haben.
          # Keine Löschungen; Konfigurationsdatei und Datenbank niemals hochladen.
          count=0
          while IFS= read -r file || [[ -n "$file" ]]; do
            remote="${file#public/}"
            echo "Übertrage $remote …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
            count=$((count+1))
          done < deploy-files.txt
          echo "$count freigegebene Website-Dateien erfolgreich übertragen."

      - name: Live-Seite auf Produktlogos und Navigation prüfen
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/verify_live_deploy.py
