name: TENNILO Website manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: tennilo-website-deploy
  cancel-in-progress: false

jobs:
  discover:
    name: Workflow registrieren – kein Upload
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'TENNILO-Workflow registriert. Kein Upload ausgeführt.'

  deploy:
    name: Landingpage per FTPS hochladen
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Website aus GitHub abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Vorbereitende Prüfung
        shell: bash
        run: |
          set -euo pipefail
          for file in public/founders.php public/founders-admin.php public/index.html public/impressum.html public/datenschutz.html public/robots.txt public/sitemap.xml public/google8cf6756d83169a32.html public/founders.php public/founders-admin.php public/assets/styles.css public/assets/tennilo-logo.png public/assets/tennilo-icon.png public/favicon.png; do
            test -f "$file" || { echo "::error::Fehlende Datei: $file"; exit 1; }
          done

      - name: Ausschließlich Website-Dateien per FTPS übertragen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USER fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          # Der FTP-Benutzer MUSS als Startverzeichnis /tennilo-website/ haben.
          # Kein Löschen, keine Änderung der geschützten Test-App.
          for file in public/assets/styles.css public/assets/tennilo-logo.png public/assets/tennilo-icon.png public/favicon.png public/impressum.html public/datenschutz.html public/robots.txt public/sitemap.xml public/google8cf6756d83169a32.html public/index.html; do
            remote="${file#public/}"
            echo "Übertrage $remote …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs               --user "${FTP_USER}:${FTP_PASSWORD}"               --upload-file "$file"               "ftp://${FTP_HOST}:21/$remote"
          done
          echo 'Website-Dateien einschließlich Founders-Endpunkte wurden übertragen.'
