name: TENNILO Website manuell veröffentlichen

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: tennilo-website-deploy
  cancel-in-progress: false

jobs:
  discover:
    name: Workflow registrieren – kein Upload
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Workflow wurde registriert. Kein FTP-Upload ausgeführt.'

  deploy:
    name: Website und Founders-PHP per FTPS hochladen
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Quellcode abrufen
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Datei-Freigabeliste prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-files.txt
          count=0
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ "$file" =~ ^public/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Ungültiger Dateipfad: $file"; exit 1; }
            [[ "$file" != *..* ]] || { echo "::error::Pfad mit '..' verboten"; exit 1; }
            test -f "$file" || { echo "::error::Datei fehlt: $file"; exit 1; }
            count=$((count+1))
          done < deploy-files.txt
          echo "Freigegebene Dateien: $count"
          grep -Fxq "public/founders.php" deploy-files.txt
          grep -Fxq "public/newsletter.php" deploy-files.txt
          grep -Fxq "public/admin/index.php" deploy-files.txt
          grep -Fxq "public/founders-admin.php" deploy-files.txt
          grep -Fxq "public/founders-mail.php" deploy-files.txt
          grep -Fxq "public/founders-email-template.php" deploy-files.txt
          grep -Fxq "public/founders-setup.php" deploy-files.txt
          grep -Fxq "public/founders-check.php" deploy-files.txt
          grep -Fxq "public/index.html" deploy-files.txt
          grep -Fxq "public/en/index.html" deploy-files.txt
          grep -Fxq "public/en/imprint.html" deploy-files.txt
          grep -Fxq "public/en/privacy.html" deploy-files.txt
          grep -Fxq "public/assets/score-creative.css" deploy-files.txt
          grep -Fxq "public/assets/court-edition.css" deploy-files.txt
          grep -Fxq "public/assets/score-demo.js" deploy-files.txt
          grep -Fxq "public/assets/theme.js" deploy-files.txt
          grep -Fxq "public/assets/theme.css" deploy-files.txt

      - name: Score-Startseite und Navigation prüfen
        run: |
          node --check public/assets/site-interactions.js
          node --check public/assets/score-demo.js
          node --check public/assets/theme.js
          node --test tests/score-landing-test.mjs tests/tennilo-language-test.mjs tests/tennilo-creative-test.mjs tests/tennilo-theme-test.mjs

      - name: PHP-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -l public/founders.php
          php -l public/newsletter.php
          php -l public/admin/index.php
          php -l public/founders-admin.php
          php -l public/founders-mail.php
          php -l public/founders-email-template.php
          php -l public/founders-setup.php
          php -l public/founders-check.php

      - name: Ausschließlich freigegebene Website-Dateien per FTPS übertragen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USER fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          # FTP-Benutzer muss sein Startverzeichnis in /tennilo-website/ haben.
          # Keine Löschungen; Konfigurationsdatei und Datenbank niemals hochladen.
          count=0
          while IFS= read -r file || [[ -n "$file" ]]; do
            remote="${file#public/}"
            echo "Übertrage $remote …"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
            count=$((count+1))
          done < deploy-files.txt
          echo "$count freigegebene Website-Dateien erfolgreich übertragen."
