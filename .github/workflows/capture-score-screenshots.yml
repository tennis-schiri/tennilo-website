name: TENNILO Score Demo-Screenshots aktualisieren

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-score-screenshots.yml'
      - 'scripts/capture_score_screenshots.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Website-Repository abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: TENNILO Score Demo aus dem Original-Repository abrufen
        uses: actions/checkout@v4
        with:
          repository: tennis-schiri/tennilo-score
          ref: main
          path: .score-source
          persist-credentials: false
      - name: Browser für echte Demo-Screenshots vorbereiten
        run: |
          python -m pip install --quiet playwright Pillow
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python -m playwright install chromium
          fi
      - name: Watch, iPhone und Scoreboard aus der Demo aufnehmen
        run: |
          python scripts/capture_score_screenshots.py
          file public/assets/score-demo-*.png
          test -s public/assets/score-demo-watch.png
          test -s public/assets/score-demo-phone.png
          test -s public/assets/score-demo-scoreboard.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ('watch', 'phone', 'scoreboard'):
              file = Path('public/assets') / f'score-demo-{name}.png'
              image = Image.open(file)
              assert image.mode == 'RGBA', f'{name}: transparency missing'
              assert image.getpixel((0, 0))[3] == 0, f'{name}: corner still visible'
              assert image.getpixel((image.width - 1, 0))[3] == 0
              assert image.getpixel((0, image.height - 1))[3] == 0
              assert image.getpixel((image.width - 1, image.height - 1))[3] == 0
              assert image.getpixel((image.width // 2, image.height // 2))[3] > 240
              print(f'{name}: all 4 corners transparent, screen retained')
          PY
      - name: Originale Demo-Screenshots in der Website speichern
        run: |
          git config user.name 'TENNILO Screenshot Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/score-demo-watch.png public/assets/score-demo-phone.png public/assets/score-demo-scoreboard.png
          if git diff --cached --quiet; then
            echo 'Screenshots unchanged'
          else
            git commit -m 'Add authentic TENNILO Score prototype screenshots [skip ci]'
            git push origin HEAD:main
          fi
