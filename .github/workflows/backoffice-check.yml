name: TENNILO Newsletter-Backoffice prüfen

on:
  push:
    paths:
      - 'public/admin/**'
      - 'public/founders-admin.php'
      - 'public/founders-mail.php'
      - 'public/founders-email-template.php'
      - 'public/newsletter.php'
      - 'deploy-files.txt'
      - 'public/index.html'
      - 'public/impressum.html'
      - 'public/datenschutz.html'
      - 'public/assets/score-home.css'
      - 'public/assets/site-interactions.js'
      - 'tests/score-landing-test.mjs'
      - 'tests/tennilo-language-test.mjs'
      - 'tests/tennilo-creative-test.mjs'
      - 'public/assets/score-creative.css'
      - 'public/assets/court-edition.css'
      - 'public/assets/score-demo.js'
      - 'public/assets/theme.js'
      - 'public/assets/theme.css'
      - 'public/assets/back-to-top.css'
      - 'tests/tennilo-theme-test.mjs'
      - 'public/en/**'
      - 'public/sitemap.xml'
      - 'tests/tennilo-email-template-test.php'
      - 'tests/tennilo-campaign-editor-test.php'
      - '.github/workflows/backoffice-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-deploy-allowlist:
    name: PHP-Syntax und FTPS-Freigabe
    runs-on: ubuntu-24.04
    steps:
      - name: Website auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: PHP-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -v
          for file in public/admin/index.php public/founders-admin.php public/founders-mail.php public/founders-email-template.php public/newsletter.php; do
            php -l "$file"
          done
      - name: Produktseite und Scroll-Navigation prüfen
        run: |
          node --check public/assets/site-interactions.js
          node --check public/assets/score-demo.js
          node --check public/assets/theme.js
          node --test tests/score-landing-test.mjs tests/tennilo-language-test.mjs tests/tennilo-creative-test.mjs tests/tennilo-theme-test.mjs
      - name: Mail-Vorlagen und Links prüfen
        shell: bash
        run: |
          set -euo pipefail
          php tests/tennilo-email-template-test.php
          php tests/tennilo-campaign-editor-test.php
      - name: Sichere FTPS-Freigabeliste prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'public/admin/index.php' deploy-files.txt
          ! grep -Eiq '(\.sqlite|tennilo-founders-config\.php|private|\.env)' deploy-files.txt
          grep -Fq 'php -l public/admin/index.php' .github/workflows/deploy.yml
          echo 'Backoffice bereit für den manuellen Deployment-Workflow (kein Upload).'
