name: TENNILO Newsletter-Backoffice prüfen

on:
  push:
    paths:
      - 'public/admin/**'
      - 'public/visit.php'
      - 'tests/tennilo-analytics-test.php'
      - 'public/founders-admin.php'
      - 'public/founders-mail.php'
      - 'public/founders-email-template.php'
      - 'public/newsletter.php'
      - 'deploy-files.txt'
      - 'public/index.html'
      - 'public/impressum.html'
      - 'public/datenschutz.html'
      - 'public/assets/score-home.css'
      - 'public/assets/site-interactions.js'
      - 'tests/score-landing-test.mjs'
      - 'tests/tennilo-language-test.mjs'
      - 'tests/tennilo-creative-test.mjs'
      - 'public/assets/score-creative.css'
      - 'public/assets/court-edition.css'
      - 'public/assets/professional-home.css'
      - 'public/assets/home-overview.css'
      - 'public/assets/product-pages.css'
      - 'public/score/**'
      - 'public/clubdisplay/**'
      - 'public/tournament/**'
      - 'public/umpire/**'
      - 'public/updates/**'
      - 'public/assets/score-demo.js'
      - 'public/assets/theme.js'
      - 'public/assets/theme.css'
      - 'public/assets/back-to-top.css'
      - 'public/assets/transparent-logos.css'
      - 'public/assets/footer-credit.css'
      - 'scripts/build_mw_footer_logos.py'
      - 'branding/mw-monogram-original.png'
      - 'scripts/prepare_transparent_logos.py'
      - 'tests/tennilo-theme-test.mjs'
      - 'public/en/**'
      - 'public/founders/**'
      - 'public/assets/founders-campaign.css'
      - 'brand-assets/founders/**'
      - 'scripts/prepare_founders_badges.py'
      - 'scripts/prepare_founders_certificates.py'
      - 'tests/founders-fulfilment-test.php'
      - 'tests/founders-campaign-test.mjs'
      - 'public/sitemap.xml'
      - 'tests/tennilo-email-template-test.php'
      - 'tests/tennilo-campaign-editor-test.php'
      - '.github/workflows/backoffice-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-deploy-allowlist:
    name: PHP-Syntax und FTPS-Freigabe
    runs-on: ubuntu-24.04
    steps:
      - name: Website auschecken
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Freigestellte TENNILO-Logos erstellen
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet "Pillow>=10,<13"
          python3 scripts/prepare_transparent_logos.py
          python3 scripts/prepare_home_badges.py
          python3 scripts/build_mw_footer_logos.py
          python3 scripts/prepare_founders_badges.py
          python3 scripts/prepare_founders_certificates.py
          for variant in tf09-light tf09-dark tf12-light tf12-dark; do
            upper="${variant%%-*}"; mode="${variant#*-}"
            cp "brand-assets/founders/TENNILO-Founders-${upper^^}-$mode.png" "public/assets/tennilo-founders-$variant.png"
          done

      - name: ClubDisplay-Demo-Screenshots für Assetprüfung erzeugen
        run: |
          python3 -m pip install --quiet playwright
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1; then
            python3 -m playwright install --with-deps chromium
          fi
          python3 scripts/capture_clubdisplay_screenshots.py
      - name: PHP-Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          php -v
          for file in public/visit.php public/admin/analytics.php public/admin/index.php public/admin/founders.php public/admin/founders-fulfilment-lib.php public/founders/supporters.php public/founders-admin.php public/founders-mail.php public/founders-email-template.php public/newsletter.php; do
            php -l "$file"
          done
      - name: Produktseite und Scroll-Navigation prüfen
        run: |
          node --check public/assets/site-interactions.js
          node --check public/assets/score-demo.js
          node --check public/assets/theme.js
          node --test tests/score-landing-test.mjs tests/tennilo-language-test.mjs tests/tennilo-creative-test.mjs tests/tennilo-theme-test.mjs tests/founders-campaign-test.mjs
      - name: Mail-Vorlagen und Links prüfen
        shell: bash
        run: |
          set -euo pipefail
          php tests/tennilo-email-template-test.php
          php tests/tennilo-campaign-editor-test.php
          php tests/tennilo-analytics-test.php
          php tests/founders-fulfilment-test.php
      - name: Sichere FTPS-Freigabeliste prüfen
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'public/admin/index.php' deploy-files.txt
          grep -Fxq 'public/visit.php' deploy-files.txt
          grep -Fxq 'public/admin/analytics.php' deploy-files.txt
          ! grep -Eiq '(\.sqlite|tennilo-founders-config\.php|private|\.env)' deploy-files.txt
          grep -Fq 'php -l public/admin/index.php' .github/workflows/deploy.yml
          echo 'Backoffice bereit für den manuellen Deployment-Workflow (kein Upload).'
