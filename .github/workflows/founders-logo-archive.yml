name: TENNILO Founders Logo-Archiv
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/founders-logo-archive.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: TENNILO-Founders-Logo-Set-v1.0
          path: brand-assets/founders/
          if-no-files-found: error
          retention-days: 7
